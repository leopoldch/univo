[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "univo"
description = "Fast, local duplicate detection for your data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Léopold Chappuis" }]
dynamic = ["version"]
keywords = ["deduplication", "record-linkage", "entity-resolution", "fuzzy-matching", "embeddings"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/leopoldch/univo"
Documentation = "https://leopoldch.github.io/univo/"
Repository = "https://github.com/leopoldch/univo"
Issues = "https://github.com/leopoldch/univo/issues"
Changelog = "https://github.com/leopoldch/univo/releases"

[dependency-groups]
dev = ["maturin>=1.15,<2", "pytest>=9.1", "ruff>=0.16", "mypy>=2.4"]
# Builds the documentation site; never installed with the package.
docs = ["mkdocs-material==9.7.7", "mkdocs>=1.6,<2"]

[tool.maturin]
manifest-path = "crates/univo-python/Cargo.toml"
module-name = "univo._univo"
python-source = "python"
features = ["extension-module"]
profile = "release"

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/tools"]
pythonpath = ["tools", "tools/checks", "tools/fixtures", "tools/quality"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = ["perf: resource budget checks from benchmarks/budgets.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["python", "tools", "tools/checks", "tools/fixtures", "tools/quality"]
files = ["python/univo", "tests/python", "tests/tools", "tools", "benchmarks"]

[[tool.mypy.overrides]]
# Spike dependencies live in the spike environment, not in the project's.
module = [
    "huggingface_hub.*",
    "model2vec.*",
    "numpy.*",
    "pyarrow.*",
    "semhash.*",
    "sentence_transformers.*",
    "torch.*",
]
ignore_missing_imports = true
