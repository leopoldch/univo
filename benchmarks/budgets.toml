# Resource budgets enforced by the perf test suites.
#
# Values come from specs/07-performance.md. They are upper bounds on the
# reference machine described in docs/performance.md. Shared CI runners apply
# the documented UNIVO_PERF_SLACK multiplier to time budgets only; size
# budgets are never relaxed.

[python.import]
# Wall time of `import univo` in a fresh interpreter, model never loaded.
p95_ms = 20.0
samples = 30

[python.finder_construction]
p95_ms = 20.0
samples = 30

[wheel]
# Compressed wheel size, model weights excluded.
max_compressed_mib = 30.0

[core.prepare]
# Validation and normalization of the standard workload of
# specs/07-performance.md (identifier, tenant, 20-character name, hostname,
# 30-token description), single thread, median of five runs. Measured at
# 86 ms on the reference machine (U-006) and 110 ms once names keep their
# trigrams for lexical comparison (U-008); the budget leaves room for noise
# and fails on regressions such as the first, unoptimized version (300 ms).
records = 100000
max_ms = 150.0

[engine.dense_insert]
# One dense group, one thread, median of five after one warmup.
# Both one batch and single-record batches, with no IDs or descending integer IDs.
# Input preparation and index destruction are excluded. Full add() is timed.
# At 40k: measured ~2 ms without IDs and ~7 ms with IDs on the reference machine.
# The previous full-bucket sort took ~718 ms without IDs.
records = 40000
max_ms = 25.0

[core.compare]
# Pairwise comparison of prepared standard records of one partition, each
# against its next `candidates` records, as when reranking candidates:
# identifier, tenant, hybrid name, hostname and semantic description, single
# thread, median of five runs. Measured at 311 ms on the reference machine
# (U-008), down from 645 ms with a quadratic edit distance.
pairs = 1000000
candidates = 50
max_ms = 550.0

[core.compare_objects]
# Pairwise comparison of prepared configurations: discriminant service and
# environment, discriminant parameters with a nested object compared key by
# key, semantic description; each against its next `candidates` records,
# single thread, median of five runs. Measured at 143 ms on the reference
# machine (U-008 review).
pairs = 1000000
candidates = 50
max_ms = 250.0

[embed.first_encoding]
# Loading the default model from local files already in the OS cache,
# verifying every file and encoding one text, median of five.
# specs/07-performance.md allows 2 s; measured at 18 ms on the reference
# machine (U-009).
max_ms = 200.0

[embed.encode]
# Encoding descriptions of the standard workload (30 words, about 39
# tokens) with the default model, one thread, median of five after one
# warmup. Measured at 0.95 s on the reference machine (U-009), about 21 000
# texts per second, against the 2000 objects per second of
# specs/07-performance.md. Tokenization takes nearly all of it.
texts = 20000
max_ms = 1400.0

[engine.vector_search]
# Exhaustive top-k over unit vectors of the default model's dimension, one
# query against every record, one thread, median of 25 queries after one
# warmup. Measured at 2.5 ms on the reference machine (U-010), about 10
# billion multiply-adds per second; the budget fails if the dot product
# stops being vectorized.
records = 100000
k = 10
max_ms = 5.0

[engine.lexical_search]
# Lexical candidates for synthetic company names (two or three words of two
# or three syllables and a number, about 20 characters), one partition, one
# thread: index build (median of 3) and complete search at the threshold
# below (p95 of 200 queries, no work limit). Measured at 24 ms and 6.5 ms on
# the reference machine (U-010). Lower thresholds cost more, because edit
# similarity then allows many edits: about 20 ms at 0.7.
records = 100000
threshold = 0.8
max_build_ms = 50.0
max_query_ms = 15.0

[engine.search]
# End-to-end search of a stored record (all lanes, scoring, ranking) over
# the standard workload of specs/07-performance.md: ID, tenant, a name of
# about 20 characters, a semantic description of 30 words with synthetic
# embeddings of 256 dimensions, one record in ten a near-duplicate of the
# previous one; one thread, limit 10, no work limit. Protocol of
# specs/07-performance.md: five independent repetitions of 1000 queries
# after a warmup; the budget applies to the median of the five p95.
# max_ms covers one partition (the worst case) and ten; max_group_ms covers
# queries from a group of 10 000 identical records in one partition, which
# score every member. Measured at 9.9 ms (one partition), 2.2 ms (ten) and
# 8.0 ms (group) on the reference machine (U-010);
# specs/07-performance.md allows 50 ms with four threads. Encoding a new
# query with the model is not included.
records = 100000
min_score = 0.8
max_ms = 25.0
max_group_ms = 20.0
