name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got, with any error code and message.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal script with synthetic records. Do not paste personal or customer data.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `python -c "import univo; print(univo.__version__)"`, or the commit.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, CPU architecture and Python version.
    validations:
      required: true
