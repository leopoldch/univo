name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .
      - run: uv run --only-group dev mypy
      - run: python tools/check_links.py .
      - run: python tools/check_native_dependencies.py univo-python
      - run: python tools/build_critical_corpus.py --check
      - run: uv run --only-group dev pytest tests/tools tests/corpus

  rust:
    name: rust (${{ matrix.platform }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64, windows-x86_64, windows-arm64]
        toolchain: [stable]
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2025 }
          - { platform: windows-arm64, runner: windows-11-arm }
          - { platform: linux-x86_64, runner: ubuntu-24.04, toolchain: "1.85" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release

  wheels:
    name: wheels (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, target: x86_64, tag: manylinux_2_17_x86_64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, tag: manylinux_2_17_aarch64 }
          - { platform: macos-x86_64, runner: macos-15-intel, target: x86_64, tag: _x86_64 }
          - { platform: macos-arm64, runner: macos-15, target: aarch64, tag: _arm64 }
          - { platform: windows-x86_64, runner: windows-2025, target: x64, tag: win_amd64 }
          - { platform: windows-arm64, runner: windows-11-arm, target: aarch64, tag: win_arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - run: python tools/check_wheel.py --platform-tag "${{ matrix.tag }}" dist/*.whl
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  wheel-test:
    name: wheel-test (${{ matrix.platform }}, ${{ matrix.python }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64, macos-x86_64, macos-arm64, windows-x86_64, windows-arm64]
        python: ["3.11", "3.14"]
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, machine: x86_64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, machine: aarch64 }
          - { platform: macos-x86_64, runner: macos-15-intel, machine: x86_64 }
          - { platform: macos-arm64, runner: macos-15, machine: aarch64 }
          - { platform: windows-x86_64, runner: windows-2025, machine: x86_64 }
          - { platform: windows-arm64, runner: windows-11-arm, machine: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      UNIVO_EXPECT_INSTALLED: "1"
      UNIVO_EXPECT_MACHINE: ${{ matrix.machine }}
      UNIVO_PERF_SLACK: "2.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse
      - name: Create a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then
            echo "VENV_PYTHON=$RUNNER_TEMP/venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "VENV_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Install the wheel without compiling
        shell: bash
        run: |
          "$VENV_PYTHON" -m pip install --no-index --only-binary :all: wheelhouse/*.whl
          "$VENV_PYTHON" -m pip install pytest
      - name: Run the test suite from outside the source tree
        shell: bash
        working-directory: ${{ runner.temp }}
        run: >
          "$VENV_PYTHON" -m pytest -p no:cacheprovider
          -c "$GITHUB_WORKSPACE/pyproject.toml" --rootdir "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/tests/python"

  wheel-test-no-rust:
    name: wheel-test-no-rust (${{ matrix.platform }}, ${{ matrix.python }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64]
        python: ["3.11", "3.14"]
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, machine: x86_64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, machine: aarch64 }
    runs-on: ${{ matrix.runner }}
    container: python:${{ matrix.python }}-slim
    env:
      UNIVO_EXPECT_INSTALLED: "1"
      UNIVO_EXPECT_MACHINE: ${{ matrix.machine }}
      UNIVO_PERF_SLACK: "2.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.platform }}
          path: wheelhouse
      - name: Confirm that no Rust toolchain is available
        run: "! command -v cargo && ! command -v rustc"
      - run: |
          python -m venv /opt/venv
          /opt/venv/bin/python -m pip install --no-index --only-binary :all: wheelhouse/*.whl
          /opt/venv/bin/python -m pip install pytest
      - working-directory: /tmp
        run: >
          /opt/venv/bin/python -m pytest -p no:cacheprovider
          -c "$GITHUB_WORKSPACE/pyproject.toml" --rootdir "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/tests/python"
