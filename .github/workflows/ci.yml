name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .
      - run: uv run --only-group dev mypy
      - run: python tools/check_links.py .

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: macos-14
            toolchain: stable
          - os: ubuntu-latest
            toolchain: "1.85"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - run: python tools/check_wheel.py dist/*.whl
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  wheel-test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      UNIVO_EXPECT_INSTALLED: "1"
      UNIVO_PERF_SLACK: "2.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse
      - name: Install the wheel in a clean environment without compiling
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then
            echo "VENV_PYTHON=$RUNNER_TEMP/venv/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "VENV_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
          fi
      - shell: bash
        run: |
          "$VENV_PYTHON" -m pip install --no-index --only-binary :all: wheelhouse/*.whl
          "$VENV_PYTHON" -m pip install pytest
      - name: Run the test suite from outside the source tree
        shell: bash
        working-directory: ${{ runner.temp }}
        run: >
          "$VENV_PYTHON" -m pytest -p no:cacheprovider
          -c "$GITHUB_WORKSPACE/pyproject.toml" --rootdir "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/tests/python"

  wheel-test-no-rust:
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    container: python:${{ matrix.python }}-slim
    env:
      UNIVO_EXPECT_INSTALLED: "1"
      UNIVO_PERF_SLACK: "2.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest
          path: wheelhouse
      - name: Confirm that no Rust toolchain is available
        run: "! command -v cargo && ! command -v rustc"
      - run: |
          python -m venv /opt/venv
          /opt/venv/bin/python -m pip install --no-index --only-binary :all: wheelhouse/*.whl
          /opt/venv/bin/python -m pip install pytest
      - working-directory: /tmp
        run: >
          /opt/venv/bin/python -m pytest -p no:cacheprovider
          -c "$GITHUB_WORKSPACE/pyproject.toml" --rootdir "$GITHUB_WORKSPACE"
          "$GITHUB_WORKSPACE/tests/python"
