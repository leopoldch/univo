[package]
name = "univo-engine"
description = "Local indexing and search for Univo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fast-hnsw = "=1.0.1"
rayon = "1.12.0"
univo-core.workspace = true
univo-embed.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
