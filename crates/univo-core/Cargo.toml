[package]
name = "univo-core"
description = "Core types and matching logic for Univo, independent of any binding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["deduplication", "record-linkage", "entity-resolution", "fuzzy-matching", "normalization"]
categories = ["text-processing", "algorithms"]

[dependencies]
wide = { version = "0.7.33", default-features = false }
caseless = "0.2.2"
rustc-hash = { version = "2.1.3", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }

[dev-dependencies]
# Not published: path only, so `cargo publish` drops it.
univo-testkit = { path = "../univo-testkit" }
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[[bench]]
name = "normalize"
harness = false

[lints]
workspace = true
