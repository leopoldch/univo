[package]
name = "univo-embed"
description = "Local embedding models for Univo: resolution, verified cache and static inference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The implementation of the Python package; not published.
publish = false
keywords = ["embeddings", "model2vec", "deduplication", "offline"]
categories = ["text-processing"]

[dependencies]
univo-core.workspace = true
model2vec-rs = { version = "=0.3.0", default-features = false, features = ["local-only", "fancy-regex"] }
rayon = "1.12.0"
rustc-hash = { version = "2.1.3", default-features = false }
# The Unicode tables of `tokenizers` 0.21, which the native tokenizer must match.
unicode-normalization-alignments = "=0.1.12"
unicode_categories = "=0.1.1"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.151"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
# Not published: path only, so `cargo publish` drops it.
univo-testkit = { path = "../univo-testkit" }
# Oracle for the native tokenizer; already linked through model2vec-rs.
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
