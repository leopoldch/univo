[workspace]
resolver = "3"
members = [
    "crates/univo-core",
    "crates/univo-embed",
    "crates/univo-engine",
    "crates/univo-python",
    "crates/univo-testkit",
]
exclude = ["benchmarks"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/leopoldch/univo"
homepage = "https://github.com/leopoldch/univo"
authors = ["Léopold Chappuis"]

[workspace.dependencies]
univo-core = { path = "crates/univo-core", version = "1.0.1" }
univo-engine = { path = "crates/univo-engine", version = "1.0.1" }
univo-embed = { path = "crates/univo-embed", version = "1.0.1" }
pyo3 = { version = "0.29.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
strip = "none"
debug = "line-tables-only"
